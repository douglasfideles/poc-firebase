include /etc/ldap/schema/core.schema
include /etc/ldap/schema/cosine.schema
include /etc/ldap/schema/inetorgperson.schema

modulepath /usr/lib/ldap
moduleload back_mdb

pidfile /run/slapd/slapd.pid
argsfile /run/slapd/slapd.args

TLSCACertificateFile /certs-pub/ca.crt
TLSCertificateFile /etc/ldap/tls/ldap.crt
TLSCertificateKeyFile /etc/ldap/tls/ldap.key

# Sem bind anônimo e sem senha em texto claro fora de TLS.
disallow bind_anon
security simple_bind=128

database mdb
maxsize 268435456
suffix "dc=unib,dc=test"
rootdn "cn=admin,dc=unib,dc=test"
rootpw @@ROOTPW@@
directory /var/lib/ldap-poc
index objectClass eq
index uid eq

# A senha só serve para autenticar. A conta de serviço lê o resto; cada pessoa lê a si mesma.
access to attrs=userPassword
  by anonymous auth
  by * none
access to *
  by dn.exact="cn=leitor,ou=servicos,dc=unib,dc=test" read
  by self read
  by * none
